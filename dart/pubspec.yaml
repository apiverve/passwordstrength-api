name: apiverve_passwordstrength
description: "Password Strength is a password strength checker API that scores how strong a password is. It returns a strength label and score, a breakdown of the character types used, weak-pattern detection, theoretical entropy in bits, and recommendations to improve it."
version: 1.2.5
homepage: https://apiverve.com/marketplace/passwordstrength?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/passwordstrength-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
