[project]
name = "apiverve-passwordstrength"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Password Strength is a password strength checker API that scores how strong a password is. It returns a strength label and score, a breakdown of the character types used, weak-pattern detection, theoretical entropy in bits, and recommendations to improve it."
keywords = ["password strength api", "password strength checker api", "signup password check api", "password strength checker", "check password strength"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/passwordstrength?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/passwordstrength?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/passwordstrength-api"
Twitter = "https://twitter.com/apivervehq"
